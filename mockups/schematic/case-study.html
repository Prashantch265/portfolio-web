  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get("slug");
      var projects = window.SITE_DATA.projects;
      var project = projects.filter(function (p) { return p.slug === slug; })[0] || projects[0];

      document.title = project.title + " — Prashant Chaudhary";

      var header = document.getElementById("study-header");
      header.innerHTML =
        '<h1 class="text-display study-header__title">' + project.title + '</h1>' +
        '<p class="text-body-lg study-header__summary">' + project.summary + '</p>' +
        '<div class="study-header__meta">' +
        '<span class="mono-meta text-small">' + project.years + '</span>' +
        '<ul class="tag-list"><li class="tag">Case study</li>' + project.stack.map(function (s) { return '<li class="tag">' + s + '</li>'; }).join("") + '</ul>' +
        '</div>';

      var diagramMount = document.getElementById("diagram-mount");
      if (project.diagram) {
        diagramMount.innerHTML =
          '<div class="diagram-frame diagram-frame--panel-side">' +
          '<div class="diagram-frame__toolbar">' +
          '<span class="diagram-frame__caption">System architecture — hover or focus a node</span>' +
          '<button class="diagram-text-toggle" data-diagram-text-toggle aria-expanded="false">View as text</button>' +
          '</div>' +
          '<div class="diagram-frame__body">' +
          '<div class="diagram-canvas-wrap" data-diagram-canvas></div>' +
          '<div class="bp-annotation" data-diagram-panel></div>' +
          '</div>' +
          '<div class="diagram-text-equivalent" data-diagram-text-panel hidden></div>' +
          '</div>';
        window.BlueprintDiagram.mount(diagramMount, project.diagram);
      }

      var prose = document.getElementById("prose-sections");
      var html = "";

      html += '<section class="prose-section"><h3 class="text-h3">Context</h3><p>' + project.context + "</p></section>";

      html +=
        '<section class="prose-section"><h3 class="text-h3">Constraints</h3><ul>' +
        project.constraints.map(function (c) { return "<li>" + c + "</li>"; }).join("") +
        "</ul></section>";

      html += '<section class="prose-section"><h3 class="text-h3">Decisions and tradeoffs</h3>';
      project.decisions.forEach(function (d, i) {
        if (i === 1) {
          // the contested-pushback narrative renders as a callout — §7
          html +=
            '<div class="callout"><span class="label callout__label">Decision point</span>' +
            "<strong style=\"display:block;margin-bottom:var(--space-2);\">" + d.heading + "</strong><p>" + d.body + "</p></div>";
        } else {
          html +=
            '<div style="margin-top:var(--space-5);"><strong style="display:block;margin-bottom:var(--space-2);">' +
            d.heading +
            "</strong><p>" +
            d.body +
            "</p></div>";
        }
      });
      html += "</section>";

      prose.innerHTML = html;

      document.getElementById("outcome-section").innerHTML =
        '<h3 class="text-h3">Outcome</h3><p style="margin-top:var(--space-4);">' + project.outcome + "</p>";

      var prevP = projects.filter(function (p) { return p.slug === project.prevSlug; })[0];
      var nextP = projects.filter(function (p) { return p.slug === project.nextSlug; })[0];
      var nav = document.getElementById("study-nav");
      nav.innerHTML =
        (prevP
          ? '<a href="case-study.html?slug=' + prevP.slug + '" style="text-decoration:none;color:inherit;"><span class="label">← Previous</span><div class="text-h3" style="margin-top:var(--space-2);max-width:24ch;">' + prevP.title + "</div></a>"
          : "<span></span>") +
        (nextP
          ? '<a href="case-study.html?slug=' + nextP.slug + '" style="text-decoration:none;color:inherit;text-align:right;"><span class="label">Next →</span><div class="text-h3" style="margin-top:var(--space-2);max-width:24ch;">' + nextP.title + "</div></a>"
          : "<span></span>");
    })();
  </script>
