  <main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get("slug");
      var projects = window.SITE_DATA.projects;
      var project = projects.filter(function (p) { return p.slug === slug; })[0] || projects[0];

      document.title = project.title + " — Prashant Chaudhary";

      var header = document.getElementById("study-header");
      header.innerHTML =
        '<h1 class="text-display study-header__title" style="color:var(--signal-info);">' + project.title + '</h1>' +
        '<p class="study-header__invocation" style="margin-top:var(--space-2);">' + project.invocation + '</p>' +
        '<p class="text-body-lg study-header__summary">' + project.summary + '</p>' +
        '<div class="study-header__meta">' +
        '<span class="text-small">' + project.years + '</span>' +
        '<ul class="tag-list"><li class="tag">case study</li>' + project.stack.map(function (s) { return '<li class="tag">' + s + '</li>'; }).join("") + '</ul>' +
        '</div>';

      var diagramMount = document.getElementById("diagram-mount");
      if (project.diagram) {
        diagramMount.innerHTML =
          '<div class="diagram-frame diagram-frame--panel-side">' +
          '<div class="diagram-frame__toolbar">' +
          '<span class="diagram-frame__caption">system architecture -- hover or focus a node</span>' +
          '<button class="diagram-text-toggle" data-diagram-text-toggle aria-expanded="false">cat --text</button>' +
          '</div>' +
          '<div class="diagram-frame__body">' +
          '<div class="diagram-canvas-wrap" data-diagram-canvas></div>' +
          '<div class="bp-annotation" data-diagram-panel></div>' +
          '</div>' +
          '<div class="diagram-text-equivalent" data-diagram-text-panel hidden></div>' +
          '</div>';
        window.BlueprintDiagram.mount(diagramMount, project.diagram);
      }

      var prose = document.getElementById("prose-sections");
      var html = "";

      html += '<section class="prose-section" data-rail-line><span class="prose-section__invocation">$ context</span><h3 class="text-h3">context</h3><p>' + project.context + "</p></section>";

      html +=
        '<section class="prose-section" data-rail-line><span class="prose-section__invocation">$ constraints --list</span><h3 class="text-h3">constraints</h3><ul>' +
        project.constraints.map(function (c) { return "<li>" + c + "</li>"; }).join("") +
        "</ul></section>";

      html += '<section class="prose-section" data-rail-line><span class="prose-section__invocation">$ log --decisions</span><h3 class="text-h3">decisions and tradeoffs</h3>';
      project.decisions.forEach(function (d, i) {
        if (i === 1) {
          html +=
            '<div class="callout callout--decision"><span class="prompt-label callout__label">decision point</span>' +
            "<strong style=\"display:block;margin-bottom:var(--space-2);color:var(--signal);\">" + d.heading + "</strong><p>" + d.body + "</p></div>";
        } else {
          html +=
            '<div style="margin-top:var(--space-5);"><strong style="display:block;margin-bottom:var(--space-2);color:var(--signal-info);">' +
            d.heading +
            "</strong><p>" +
            d.body +
            "</p></div>";
        }
      });
      html += "</section>";

      prose.innerHTML = html;

      document.getElementById("outcome-section").innerHTML =
        '<span class="prose-section__invocation">$ outcome</span><h3 class="text-h3">outcome</h3><p style="margin-top:var(--space-4);">' + project.outcome + "</p>";

      var prevP = projects.filter(function (p) { return p.slug === project.prevSlug; })[0];
      var nextP = projects.filter(function (p) { return p.slug === project.nextSlug; })[0];
      var nav = document.getElementById("study-nav");
      nav.innerHTML =
        (prevP
          ? '<a href="case-study.html?slug=' + prevP.slug + '" style="text-decoration:none;color:inherit;"><span class="text-small">cd ../</span><div class="text-h3" style="margin-top:var(--space-2);max-width:24ch;color:var(--signal-info);">' + prevP.title + "</div></a>"
          : "<span></span>") +
        (nextP
          ? '<a href="case-study.html?slug=' + nextP.slug + '" style="text-decoration:none;color:inherit;text-align:right;"><span class="text-small">cd ../' + nextP.title + '</span><div class="text-h3" style="margin-top:var(--space-2);max-width:24ch;color:var(--signal-info);">' + nextP.title + "</div></a>"
          : "<span></span>");
    })();
  </script>
</body>
</html>
