  <script>
    (function () {
      var list = document.getElementById("project-list");
      list.innerHTML = window.SITE_DATA.projects
        .map(function (p) {
          return (
            '<a class="tree-entry" href="case-study.html?slug=' + p.slug + '">' +
            '<div class="tree-entry__top">' +
            '<span class="tree-entry__branch">├── </span>' +
            '<span class="tree-entry__path">' + p.title + '/</span>' +
            '<span class="tree-entry__years">' + p.years + "</span>" +
            "</div>" +
            '<span class="tree-entry__comment">' + p.summary + "</span>" +
            '<ul class="tag-list tree-entry__tags">' + p.stack.map(function (s) { return '<li class="tag">' + s + "</li>"; }).join("") + "</ul>" +
            "</a>"
          );
        })
        .join("");
    })();
  </script>
