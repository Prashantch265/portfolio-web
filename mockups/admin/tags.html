<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tags — Admin</title>
  <link rel="stylesheet" href="assets/tokens.css?v=1" />
  <link rel="stylesheet" href="assets/admin.css?v=1" />
</head>
<body>
  <div class="admin-gate-notice" data-admin-gate-notice>Loading admin…</div>
  <div class="admin-shell" data-admin-shell hidden>
    <div class="admin-topbar" data-admin-topbar></div>
    <aside class="admin-sidebar" data-admin-sidebar></aside>
    <main class="admin-main" data-admin-main>
      <div class="admin-page-head">
        <h1>Tags</h1>
        <span class="admin-page-head__meta">Flat CRUD — no draft/publish</span>
      </div>

      <form data-add-form class="section-block" style="display:flex;gap:var(--space-3);align-items:flex-end;">
        <div style="flex:1;">
          <div class="field" data-field-wrap="label">
            <label for="f-label">New tag label</label>
            <input type="text" id="f-label" data-field="label" />
            <div class="field__error" data-field-error="label" hidden></div>
          </div>
        </div>
        <div style="width:180px;">
          <div class="field">
            <label for="f-kind">Kind</label>
            <select id="f-kind" data-field="kind">
              <option value="project">project</option>
              <option value="post">post</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn--primary" style="margin-bottom:var(--space-3);">Add tag</button>
      </form>

      <div data-table-root></div>
    </main>
  </div>

  <script src="assets/diagram.js?v=1"></script>
  <script src="assets/seed-content.js?v=1"></script>
  <script src="assets/seed.js?v=1"></script>
  <script src="assets/db.js?v=1"></script>
  <script src="assets/api.js?v=1"></script>
  <script src="assets/routes.js?v=1"></script>
  <script src="assets/ui.js?v=1"></script>
  <script src="assets/app.js?v=1"></script>
  <script src="assets/devtools.js?v=1"></script>
  <script>
    (function () {
      "use strict";
      var UI = window.AdminUI, Api = window.Api;
      window.AdminApp.mountShell("tags", "Tags");
      var addForm = UI.qs("[data-add-form]");

      function refresh() {
        Api.send("GET", "/api/admin/tags").then(function (env) {
          UI.dataTable(UI.qs("[data-table-root]"), {
            columns: [
              { key: "label", label: "Label" },
              { key: "kind", label: "Kind" },
              { key: "actions", label: "", render: function (r) { return '<button type="button" class="btn btn--small btn--danger" data-delete="' + r.id + '">Delete</button>'; } }
            ],
            rows: env.data,
            filterFn: function (row, q) { return row.label.toLowerCase().indexOf(q) !== -1; },
            filterPlaceholder: "Filter tags…",
            onRowClick: function () {},
            emptyMessage: "No tags yet."
          });
          UI.qsa("[data-delete]").forEach(function (btn) {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              Api.send("DELETE", "/api/admin/tags/" + btn.dataset.delete).then(function () { refresh(); });
            });
          });
        });
      }

      addForm.addEventListener("submit", function (e) {
        e.preventDefault();
        UI.clearFieldErrors(addForm);
        var body = UI.readForm(addForm, ["label", "kind"]);
        Api.send("POST", "/api/admin/tags", body).then(
          function () {
            UI.qs('[data-field="label"]', addForm).value = "";
            UI.toast("Tag added.", "success");
            refresh();
          },
          function (err) {
            UI.applyFieldErrors(addForm, err);
          }
        );
      });

      Api.me().then(refresh);
    })();
  </script>
</body>
</html>
