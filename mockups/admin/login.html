<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in — Admin</title>
  <link rel="stylesheet" href="assets/tokens.css?v=1" />
  <link rel="stylesheet" href="assets/admin.css?v=1" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="login-card__wordmark">PRASHANT CHAUDHARY</div>
      <h1>Admin sign in</h1>
      <p class="lede">One owner, one session. Email and password, then a 6-digit code.</p>

      <form data-login-password-form>
        <div id="field-email" data-field-wrap="email" class="field">
          <label for="f-email">Email</label>
          <input type="email" id="f-email" data-field="email" value="prashantchy265@gmail.com" />
          <div class="field__error" data-field-error="email" hidden></div>
        </div>
        <div id="field-password" data-field-wrap="password" class="field">
          <label for="f-password">Password</label>
          <input type="password" id="f-password" data-field="password" value="" />
          <div class="field__error" data-field-error="password" hidden></div>
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;">Continue</button>
        <p class="text-small" style="color:var(--ink-muted);font-size:0.75rem;margin-top:var(--space-3);">
          Demo: any password works except the literal word "wrong" (401). Any 6-digit code works except "000000" (401).
        </p>
      </form>

      <form data-login-totp-form hidden>
        <div data-field-wrap="code" class="field">
          <label for="f-code">6-digit code</label>
          <input type="text" id="f-code" data-field="code" value="" inputmode="numeric" maxlength="6" />
          <div class="field__error" data-field-error="code" hidden></div>
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;">Verify</button>
      </form>

      <p class="noindex-note">/admin/* — noindex, single-owner session</p>
    </div>
  </div>

  <script src="assets/diagram.js?v=1"></script>
  <script src="assets/seed-content.js?v=1"></script>
  <script src="assets/seed.js?v=1"></script>
  <script src="assets/db.js?v=1"></script>
  <script src="assets/api.js?v=1"></script>
  <script src="assets/routes.js?v=1"></script>
  <script src="assets/ui.js?v=1"></script>
  <script src="assets/app.js?v=1"></script>
  <script src="assets/devtools.js?v=1"></script>
  <script>
    (function () {
      "use strict";
      var UI = window.AdminUI, Api = window.Api;

      // Already have a valid session? Skip straight past login (§3's
      // gate works the other direction too: no reason to show a login
      // form to someone who's already signed in).
      Api.me().then(function (env) {
        if (env.data && env.data.email) location.href = "index.html";
      }).catch(function () {});

      var pwForm = UI.qs("[data-login-password-form]");
      var totpForm = UI.qs("[data-login-totp-form]");
      var pendingChallengeId = null;

      pwForm.addEventListener("submit", function (e) {
        e.preventDefault();
        UI.clearFieldErrors(pwForm);
        var body = UI.readForm(pwForm, ["email", "password"]);
        Api.request("POST", "/api/admin/auth/login", body).then(
          function (env) {
            pendingChallengeId = env.data.challengeId;
            pwForm.hidden = true;
            totpForm.hidden = false;
            UI.qs("input", totpForm).focus();
          },
          function (err) {
            UI.applyFieldErrors(pwForm, err);
          }
        );
      });

      totpForm.addEventListener("submit", function (e) {
        e.preventDefault();
        UI.clearFieldErrors(totpForm);
        var body = UI.readForm(totpForm, ["code"]);
        Api.request("POST", "/api/admin/auth/totp", { challengeId: pendingChallengeId, code: body.code }).then(
          function () {
            location.href = "index.html";
          },
          function (err) {
            if (err.message === "Code expired — start over.") {
              totpForm.hidden = true;
              pwForm.hidden = false;
              UI.showFormBanner(pwForm, "Code expired — start over.");
              return;
            }
            UI.applyFieldErrors(totpForm, err);
          }
        );
      });
    })();
  </script>
</body>
</html>
