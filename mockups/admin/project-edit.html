<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Edit project — Admin</title>
  <link rel="stylesheet" href="assets/tokens.css?v=1" />
  <link rel="stylesheet" href="assets/admin.css?v=1" />
</head>
<body>
  <div class="admin-gate-notice" data-admin-gate-notice>Loading admin…</div>
  <div class="admin-shell" data-admin-shell hidden>
    <div class="admin-topbar" data-admin-topbar></div>
    <aside class="admin-sidebar" data-admin-sidebar></aside>
    <main class="admin-main" data-admin-main>
      <div class="editor-toolbar">
        <div class="editor-toolbar__title">
          <span data-project-title>Loading…</span>
          <span data-status-pill></span>
          <span data-dirty-badge></span>
        </div>
        <div class="editor-toolbar__actions">
          <button type="button" class="btn" data-save>Save draft</button>
          <button type="button" class="btn btn--primary" data-publish>Publish</button>
          <button type="button" class="btn btn--danger" data-delete>Delete</button>
        </div>
      </div>

      <form data-project-form>
        <div class="section-block">
          <h2>Core fields</h2>
          <div id="core-fields"></div>
        </div>

        <div class="section-block">
          <h2>Case-study sections <span class="text-small" style="color:var(--ink-muted);font-weight:400;">— each is its own endpoint (§7.1); Save writes all of them</span></h2>
          <h3>Context</h3>
          <div id="section-context"></div>
          <h3>Constraints</h3>
          <div id="section-constraints"></div>
          <h3>Decisions</h3>
          <div id="section-decisions"></div>
          <h3>Outcome</h3>
          <div id="section-outcome"></div>
        </div>
      </form>

      <div class="section-block">
        <h2>Diagram</h2>
        <div data-diagram-link>Loading…</div>
      </div>

      <div class="section-block">
        <h2>Revision history</h2>
        <h3>Project</h3>
        <div data-revisions-project></div>
        <h3 style="margin-top:var(--space-4);">Case-study sections <span class="text-small" style="color:var(--ink-muted);font-weight:400;">— restore disabled, §11</span></h3>
        <div data-revisions-sections></div>
      </div>
    </main>
  </div>

  <script src="assets/diagram.js?v=1"></script>
  <script src="assets/seed-content.js?v=1"></script>
  <script src="assets/seed.js?v=1"></script>
  <script src="assets/db.js?v=1"></script>
  <script src="assets/api.js?v=1"></script>
  <script src="assets/routes.js?v=1"></script>
  <script src="assets/ui.js?v=1"></script>
  <script src="assets/app.js?v=1"></script>
  <script src="assets/devtools.js?v=1"></script>
  <script>
    (function () {
      "use strict";
      var UI = window.AdminUI, Api = window.Api;
      window.AdminApp.mountShell("projects", "Edit project");

      var id = new URLSearchParams(location.search).get("id");
      var form = UI.qs("[data-project-form]");
      var constraintsList, decisionsList;

      function coreFieldsHtml(row) {
        return (
          UI.field({ name: "title", label: "Title", value: row.title }) +
          UI.field({ name: "slug", label: "Slug", value: row.slug }) +
          UI.field({ name: "kicker", label: "Kicker", value: row.kicker }) +
          UI.field({ name: "summary", label: "Summary", value: row.summary, textarea: true, rows: 3 }) +
          UI.field({ name: "years", label: "Years", value: row.years }) +
          UI.field({ name: "order", label: "Order", type: "number", value: row.order }) +
          UI.field({ name: "featured", label: "Featured on homepage", checkbox: true, checked: row.featured }) +
          UI.field({ name: "stackTags", label: "Stack (comma-separated)", value: (row.stackTags || []).join(", ") })
        );
      }

      function load() {
        Api.send("GET", "/api/admin/projects/" + id).then(function (env) {
          renderRow(UI.adaptRow(env.data));
        });
        loadDiagram();
        loadRevisions();
      }

      function renderRow(row) {
        UI.qs("[data-project-title]").textContent = row.title;
        UI.qs("[data-status-pill]").innerHTML = UI.statusPillHtml(row.status);
        UI.qs("[data-dirty-badge]").innerHTML = UI.dirtyBadgeHtml(row._hasPendingDraft);
        document.title = row.title + " — Admin";

        UI.qs("#core-fields").innerHTML = coreFieldsHtml(row);

        UI.qs("#section-context").innerHTML = UI.field({ name: "context", label: "", value: row.sections.context.value, textarea: true, rows: 4 });

        constraintsList = UI.repeatableList(
          UI.qs("#section-constraints"),
          row.sections.constraints.value.map(function (v) { return { value: v }; }),
          function (item) {
            return '<textarea data-rfield="value" rows="2" style="grid-column:1/-1;">' + UI.escapeHtml(item.value) + "</textarea>";
          },
          { blank: function () { return { value: "" }; }, addLabel: "+ Add constraint" }
        );

        decisionsList = UI.repeatableList(
          UI.qs("#section-decisions"),
          row.sections.decisions.value,
          function (item) {
            return (
              '<input data-rfield="heading" type="text" placeholder="Heading" value="' + UI.escapeHtml(item.heading) + '" style="grid-column:1/-1;" />' +
              '<textarea data-rfield="body" rows="2" placeholder="Body" style="grid-column:1/-1;">' + UI.escapeHtml(item.body) + "</textarea>" +
              '<label style="display:flex;align-items:center;gap:6px;font-size:0.8rem;"><input data-rfield="emphasis" type="checkbox"' + (item.emphasis ? " checked" : "") + " /> Emphasis (callout treatment)</label>"
            );
          },
          { blank: function () { return { heading: "", body: "", emphasis: false }; }, addLabel: "+ Add decision" }
        );

        UI.qs("#section-outcome").innerHTML = UI.field({ name: "outcome", label: "", value: row.sections.outcome.value, textarea: true, rows: 3 });
      }

      function loadDiagram() {
        Api.send("GET", "/api/admin/diagrams?ownerId=" + id).then(
          function (env) {
            UI.qs("[data-diagram-link]").innerHTML = '<a class="btn" href="diagram-edit.html?project=' + id + '">Edit diagram →</a>';
          },
          function () {
            UI.qs("[data-diagram-link]").innerHTML = '<p class="text-small" style="color:var(--ink-muted);">No diagram for this project.</p>';
          }
        );
      }

      function revisionRowHtml(rev, restorable) {
        return (
          '<div class="revision-row"><span class="revision-row__meta">' + UI.formatDate(rev.createdAt) + " · " + rev.authorId + "</span>" +
          (restorable
            ? '<button type="button" class="btn btn--small" data-restore="' + rev.id + '">Restore</button>'
            : '<button type="button" class="btn btn--small" disabled title="Restore is not yet supported for this entity type">Restore (unsupported)</button>') +
          "</div>"
        );
      }

      function loadRevisions() {
        Api.send("GET", "/api/admin/revisions?entityType=project&entityId=" + id).then(function (env) {
          var el = UI.qs("[data-revisions-project]");
          el.innerHTML = env.data.length ? env.data.map(function (r) { return revisionRowHtml(r, true); }).join("") : '<p class="text-small" style="color:var(--ink-muted);">No history yet.</p>';
          UI.qsa("[data-restore]", el).forEach(function (btn) {
            btn.addEventListener("click", function () { restore(btn.dataset.restore); });
          });
        });
        Api.send("GET", "/api/admin/revisions?entityType=caseStudySection").then(function (env) {
          var mine = env.data.filter(function (r) { return r.entityId.indexOf(id + ":") === 0; });
          var el = UI.qs("[data-revisions-sections]");
          el.innerHTML = mine.length ? mine.map(function (r) { return revisionRowHtml(r, false); }).join("") : '<p class="text-small" style="color:var(--ink-muted);">No section history yet.</p>';
        });
      }

      function restore(revId) {
        Api.send("POST", "/api/admin/revisions/" + revId + "/restore").then(function (env) {
          UI.toast(env.message, "success");
          load();
        }, function (err) {
          UI.toast(err.message, "error");
        });
      }

      function collectPatch() {
        var core = UI.readForm(form, ["title", "slug", "kicker", "summary", "years", "order", "featured", "stackTags"]);
        core.order = Number(core.order);
        core.stackTags = core.stackTags.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        return core;
      }

      UI.qs("[data-save]").addEventListener("click", function () {
        UI.clearFieldErrors(form);
        var patch = collectPatch();
        var contextVal = UI.qs('[data-field="context"]', UI.qs("#section-context")).value;
        var outcomeVal = UI.qs('[data-field="outcome"]', UI.qs("#section-outcome")).value;

        Promise.all([
          Api.send("PUT", "/api/admin/projects/" + id, function () { return patch; }),
          Api.send("PUT", "/api/admin/projects/" + id + "/sections/context", { value: contextVal }),
          Api.send("PUT", "/api/admin/projects/" + id + "/sections/constraints", { value: constraintsList.getValues().map(function (r) { return r.value; }) }),
          Api.send("PUT", "/api/admin/projects/" + id + "/sections/decisions", { value: decisionsList.getValues() }),
          Api.send("PUT", "/api/admin/projects/" + id + "/sections/outcome", { value: outcomeVal })
        ]).then(
          function () {
            UI.toast("Saved as draft.", "success");
            load();
          },
          function (err) {
            UI.applyFieldErrors(form, err);
            UI.toast(err.message, "error");
          }
        );
      });

      UI.qs("[data-publish]").addEventListener("click", function () {
        Api.send("POST", "/api/admin/projects/" + id + "/publish").then(
          function () {
            UI.toast("Published.", "success");
            load();
          },
          function (err) {
            UI.clearFieldErrors(form);
            UI.applyFieldErrors(form, err);
            UI.toast(err.message, "error");
          }
        );
      });

      UI.qs("[data-delete]").addEventListener("click", function () {
        UI.confirmDialog({
          title: "Delete this project?",
          message: "There is no unpublish endpoint (§8) — deleting is the only way to remove this from public view. This cannot be undone.",
          danger: true,
          confirmLabel: "Delete"
        }).then(function (yes) {
          if (yes) {
            Api.send("DELETE", "/api/admin/projects/" + id).then(function () {
              location.href = "projects.html";
            });
          }
        });
      });

      Api.me().then(load);
    })();
  </script>
</body>
</html>
