<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Posts — Admin</title>
  <link rel="stylesheet" href="assets/tokens.css?v=1" />
  <link rel="stylesheet" href="assets/admin.css?v=1" />
</head>
<body>
  <div class="admin-gate-notice" data-admin-gate-notice>Loading admin…</div>
  <div class="admin-shell" data-admin-shell hidden>
    <div class="admin-topbar" data-admin-topbar></div>
    <aside class="admin-sidebar" data-admin-sidebar></aside>
    <main class="admin-main" data-admin-main>
      <div class="admin-page-head">
        <h1>Posts</h1>
        <span class="admin-page-head__meta">Reuses projects' draft/publish mechanics (§8)</span>
      </div>
      <div data-table-root></div>
    </main>
  </div>

  <script src="assets/diagram.js?v=1"></script>
  <script src="assets/seed-content.js?v=1"></script>
  <script src="assets/seed.js?v=1"></script>
  <script src="assets/db.js?v=1"></script>
  <script src="assets/api.js?v=1"></script>
  <script src="assets/routes.js?v=1"></script>
  <script src="assets/ui.js?v=1"></script>
  <script src="assets/app.js?v=1"></script>
  <script src="assets/devtools.js?v=1"></script>
  <script>
    (function () {
      "use strict";
      var UI = window.AdminUI, Api = window.Api;
      window.AdminApp.mountShell("posts", "Posts");

      Api.me().then(function () {
        Api.send("GET", "/api/admin/posts").then(function (env) {
          var rows = env.data.map(UI.adaptRow);
          UI.dataTable(UI.qs("[data-table-root]"), {
            columns: [
              { key: "title", label: "Title" },
              { key: "slug", label: "Slug" },
              { key: "tags", label: "Tags", render: function (r) { return (r.tags || []).join(", "); } },
              { key: "status", label: "Status", render: function (r) { return UI.statusPillHtml(r.status) + " " + UI.dirtyBadgeHtml(r._hasPendingDraft); } },
              { key: "updatedAt", label: "Updated", render: function (r) { return UI.formatDate(r.updatedAt); } }
            ],
            rows: rows,
            filterFn: function (row, q) { return (row.title + " " + row.slug + " " + (row.tags || []).join(" ")).toLowerCase().indexOf(q) !== -1; },
            filterPlaceholder: "Filter posts…",
            onRowClick: function (row) { location.href = "post-edit.html?id=" + row.id; },
            emptyMessage: "No posts match."
          });
        });
      });
    })();
  </script>
</body>
</html>
