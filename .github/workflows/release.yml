name: Release

# Builds and publishes images on every push to main. Uses the built-in
# GITHUB_TOKEN (packages: write) — no long-lived PAT needed on the CI
# side (backend PRD §15). Deploy trigger is intentionally NOT wired here
# yet: the VPS doesn't exist (§16 open item). See infra/deploy.sh for the
# documented pull-based deploy script that will run on the VPS once it does.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Migrations run as an explicit pipeline step before the new api
  # container receives traffic (backend PRD §15) — kept as a separate,
  # visible job rather than folded into deploy, once a deploy job exists.
  # TODO(M5): add a `migrate` job here once DATABASE_URL for the VPS is
  # available as a repo secret, and a `notify-vps` job that triggers
  # infra/deploy.sh (cron poll or webhook — see that file's header).
