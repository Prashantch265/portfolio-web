name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Real Postgres + Redis, not mocked — apps/api's e2e specs boot the
    # real AppModule and hit real HTTP routes against a real database
    # (nestjs-craft testing convention: a mocked repository only proves
    # the mock returns what the test told it to).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      ADMIN_EMAIL: admin@example.com
      MAIL_PROVIDER: console
      MAIL_API_KEY: ci-key
      MAIL_FROM_ADDRESS: no-reply@example.com
      SITE_ORIGIN: http://localhost:3000
      ANALYTICS_SALT: ci-analytics-salt
    outputs:
      affected: ${{ steps.affected.outputs.json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # turbo's [<ref>] filter needs real history to diff against

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Explicit pipeline step (backend PRD §15) — mirrors how a real
      # deploy migrates before the app receives traffic, and gives the
      # test step a real, migrated schema instead of an empty database.
      - name: Run api migrations
        run: pnpm --filter @portfolio/api db:migrate

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

      # Backend PRD §13/§15: non-blocking warning in v1, upgradable to
      # blocking once the project has enough history to tune false-positive
      # tolerance.
      - name: Dependency audit (non-blocking)
        run: pnpm audit --audit-level=high || true

      # Which apps actually need a new image: @portfolio/<app>...[<range>]
      # asks turbo "is <app>, or anything in its real dependency graph,
      # affected by this range" — turbo's own graph (already the source of
      # truth for ^build/^test above), not a hand-maintained path regex
      # that has to be remembered every time a new shared package appears.
      # Only meaningful on push (build-and-push is push-only); skipped on
      # PRs since github.event.before isn't a push-event concept there.
      - name: Compute affected apps
        id: affected
        if: github.event_name == 'push'
        run: |
          before='${{ github.event.before }}'
          result='{}'
          for app in api web; do
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              build=true # no known prior commit — build to be safe
            else
              output=$(pnpm turbo run build --filter="@portfolio/$app...[$before...${{ github.sha }}]" --dry-run=json 2>/dev/null)
              if [ -z "$output" ]; then
                build=true # turbo produced nothing usable — build to be safe
              elif [ "$(echo "$output" | jq '.packages | length')" -gt 0 ]; then
                build=true
              else
                build=false
              fi
            fi
            result=$(echo "$result" | jq --arg app "$app" --argjson build "$build" '. + {($app): $build}')
          done
          echo "json=$(echo "$result" | jq -c .)" >> "$GITHUB_OUTPUT"

  # Gated on `ci` passing — only push, not PR (a PR has nothing to deploy
  # yet). No code path reaches GHCR without the same lint/typecheck/test
  # run green, regardless of branch protection settings.
  build-and-push:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7

      # Skip this matrix entry's build/push if `ci` determined @portfolio/<app>
      # (and its real dependency graph — shared packages, lockfile, etc.,
      # per turbo) wasn't affected by this push.
      - name: Check for relevant changes
        id: changes
        run: |
          build=$(echo '${{ needs.ci.outputs.affected }}' | jq -r '.["${{ matrix.app }}"]')
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # GHCR tags must be lowercase; github.repository preserves the
      # owner's actual GitHub casing (e.g. Prashantch265), so a literal
      # ${{ github.repository }} here produces an invalid tag and fails
      # the push every time.
      - name: Compute lowercase image prefix
        if: steps.changes.outputs.build == 'true'
        run: echo "IMAGE_PREFIX=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.build == 'true'

      - name: Build and push
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Migrations run as an explicit pipeline step before the new api
  # container receives traffic (backend PRD §15) — kept as a separate,
  # visible job rather than folded into deploy, once a deploy job exists.
  # TODO(M5): add a `migrate` job here once DATABASE_URL for the VPS is
  # available as a repo secret, and a `notify-vps` job that triggers
  # infra/deploy.sh (cron poll or webhook — see that file's header).
