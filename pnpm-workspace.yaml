packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@scarf/scarf': false # swagger-ui-dist's opt-out install-analytics pinger — no functional need, block the network call
  '@swc/core': true # native binary required for the package to function — vitest's NestJS decorator-metadata transform (apps/api/vitest.config.ts)
  esbuild: true
